name: Live Integration (Anthropic)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: live-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anthropic-smoke:
    name: live smoke against real Anthropic API
    runs-on: ubuntu-latest
    # Secrets aren't exposed to forked-repo runs anyway, but skip explicitly
    # so the job fails fast with a clear reason instead of an auth error.
    if: github.repository == 'catdaddyjay8/TradingAgents'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run live Anthropic smoke test
        run: python scripts/smoke_structured_output.py anthropic
